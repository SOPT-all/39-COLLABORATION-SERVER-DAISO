name: Build and Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: practice-production-deploy
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    environment: practice-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      BACKEND_IMAGE: ${{ needs.build.outputs.image }}
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Deploy and await SSM result
        run: python3 scripts/deploy-ssm.py
      - name: Verify public endpoints
        run: |
          set -euo pipefail
          [[ "$BASE_URL" =~ ^https?://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          for path in /actuator/health /swagger-ui/index.html /v3/api-docs /api/v1/products; do
            curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 3 "$BASE_URL$path" -o /dev/null
          done
