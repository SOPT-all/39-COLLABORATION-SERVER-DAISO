name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Set DEPLOY_PORT}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519_daiso_deploy
          chmod 600 ~/.ssh/id_ed25519_daiso_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deployment configuration
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519_daiso_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p "$HOME/apps/daiso"'
          scp -i ~/.ssh/id_ed25519_daiso_deploy -P "$DEPLOY_PORT" \
            docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:apps/daiso/docker-compose.yml"

      - name: Log in to GHCR on server
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          : "${GHCR_USERNAME:?Set GHCR_USERNAME}"
          : "${GHCR_PAT:?Set GHCR_PAT}"
          [[ "$GHCR_USERNAME" =~ ^[a-zA-Z0-9-]+$ ]]
          printf '%s' "$GHCR_PAT" | ssh \
            -i ~/.ssh/id_ed25519_daiso_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy backend
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519_daiso_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "BACKEND_IMAGE='$BACKEND_IMAGE' bash -s" <<'EOF'
          set -euo pipefail
          cd "$HOME/apps/daiso"
          test -f .env || { echo 'Create ~/apps/daiso/.env on the server first.'; exit 1; }
          export BACKEND_IMAGE
          compose=(docker compose -p daiso-prod --env-file .env -f docker-compose.yml)
          "${compose[@]}" config --quiet
          docker pull "$BACKEND_IMAGE"
          if ! "${compose[@]}" up -d --wait --wait-timeout 180 mysql; then
            "${compose[@]}" logs --tail=200 mysql
            exit 1
          fi
          if docker container inspect daiso-backend >/dev/null 2>&1; then
            docker rm -f daiso-backend
          fi
          docker run -d --name daiso-backend --restart unless-stopped \
            --network daiso-prod_default \
            --env-file .env -e SPRING_PROFILES_ACTIVE=prod \
            -p 8088:8088 \
            --health-cmd='curl -fsS http://127.0.0.1:8088/actuator/health' \
            --health-interval=10s --health-timeout=5s \
            --health-start-period=30s --health-retries=30 \
            "$BACKEND_IMAGE"
          for attempt in $(seq 1 36); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' daiso-backend)" = healthy ]; then
              exit 0
            fi
            sleep 10
          done
          docker logs --tail=200 daiso-backend
          exit 1
          EOF
