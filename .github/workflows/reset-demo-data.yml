name: 데모 데이터 초기화
on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: 상품·매장·재고와 좋아요·찜을 데모 데이터로 초기화합니다
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: practice-production-deploy
  cancel-in-progress: false
jobs:
  reset:
    if: github.ref == 'refs/heads/main' && inputs.confirm_reset
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    environment: practice-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      CONFIRM_RESET: ${{ inputs.confirm_reset }}
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Reset demo data and await SSM result
        run: python3 scripts/deploy-ssm.py --reset-demo
      - name: Verify API availability
        run: |
          set -euo pipefail
          [[ "$BASE_URL" =~ ^https?://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          for path in /actuator/health /api/v1/products '/api/v1/products/1/stores?soldOut=false'; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 "$BASE_URL$path" -o /dev/null
          done
