name: Publish initial image only
on:
  push:
    branches: [chore/18-aws-deployment]
    paths: [.github/workflows/initial-image.yml]
permissions:
  contents: read
jobs:
  image:
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
    secrets:
      GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
