# Dedicated disposable database only; never fall back to the local database.
spring:
  datasource:
    url: ${MIGRATION_DB_URL}
    username: ${MIGRATION_DB_USER}
    password: ${MIGRATION_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
