server:
  port: 8088

spring:
  application:
    name: daiso

  profiles:
    default: local

  config:
    import: optional:file:.env[.properties]

springdoc:
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  override-with-generic-response: false
  swagger-ui:
    doc-expansion: list
    default-models-expand-depth: -1
    supported-submit-methods: [get, patch]
