spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:daiso}?connectionTimeZone=Asia/Seoul&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: ${MYSQL_USER:daiso}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
